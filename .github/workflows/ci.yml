name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-cov mypy interrogate build
        pip install "ml-switcheroo-ir @ https://github.com/SamuelMarks/ml-switcheroo-ir/releases/download/v0.0.4/ml_switcheroo_ir-0.0.4-py3-none-any.whl"
        pip install "ml-ecosystem-snapshots @ https://github.com/SamuelMarks/ml-ecosystem-snapshots/releases/download/v0.0.4/ml_ecosystem_snapshots-0.0.4-py3-none-any.whl"
        if [ -f "pyproject.toml" ]; then pip install -e ".[test]"; fi

    - name: Check Code Formatting (Ruff)
      run: ruff format --check .

    - name: Check Linting (Ruff)
      run: ruff check .

    - name: Check Strict Static Typing (Mypy & AST Linter)
      run: |
        mypy --strict src tests scripts
        python3 scripts/lint_typing.py

    - name: Check Docstring Coverage (Interrogate & AST Verifier)
      run: |
        interrogate -vv -f 100 -M -i -c pyproject.toml src scripts tests
        python3 scripts/check_docstrings.py src scripts tests

    - name: Check Test Quality (No Vacuous Assertions)
      run: python3 scripts/lint_pass.py --check-zero-assertions

    - name: Check API Parity & Snapshot Grounding
      run: |
        python3 scripts/check_api_parity.py
        python3 scripts/check_api_snapshot.py
        if ! git diff --exit-code MLX_MISSING_API.md; then
          echo "API Parity missing file MLX_MISSING_API.md was updated. Please run scripts/check_api_parity.py locally and commit the changes."
          exit 1
        fi

    - name: Check Compiler Test Completeness
      run: |
        python3 scripts/check_compiler_test_completeness.py
        if ! git diff --exit-code COMPILER_TEST_PARITY.md; then
          echo "COMPILER_TEST_PARITY.md was updated. Please run scripts/check_compiler_test_completeness.py locally and commit the changes."
          exit 1
        fi

    - name: Test & Coverage (100% Line & Branch)
      run: |
        PYTHONPATH=src pytest --cov=src/zero_mlx --cov=scripts --cov-branch --cov-fail-under=100 --cov-report=xml

    - name: Update Badges
      run: |
        python3 scripts/update_badges.py
        if ! git diff --exit-code README.md; then
          echo "Coverage badges in README.md are out of date. Please run pre-commit or the update badges script locally and commit the changes."
          exit 1
        fi

    - name: Build Package
      run: python3 -m build
