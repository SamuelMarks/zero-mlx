[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "zero-mlx"
version = "0.1.0"
description = "Zero-dependency pure Python implementation of the MLX API surface."
authors = [{ name = "Samuel Marks" }]
requires-python = ">=3.9"
dynamic = ["dependencies", "optional-dependencies"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
test = ["requirements-test.txt"]
cuda = ["requirements-cuda.txt"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "D", "ANN", "UP", "B", "SIM"]
ignore = ["E402", "F401", "E741", "D203", "D213", "E501", "D401", "D400", "D415", "UP006", "UP007", "UP035", "UP045", "SIM108"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.interrogate]
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
ignore-setters = false
fail-under = 100
exclude = ["build", "dist", ".venv"]
verbose = 2
quiet = false
color = true

[tool.pytest.ini_options]
addopts = "--cov=src/zero_mlx --cov=scripts --cov-branch --cov-fail-under=100 --ignore=tests/official"

[tool.coverage.run]
branch = true
source = ["src/zero_mlx", "scripts"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.mypy]
python_version = "3.9"
strict = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_any_unimported = false
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
extra_checks = true
ignore_missing_imports = true
follow_imports = "silent"
mypy_path = "src"

